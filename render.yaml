databases:
  - name: edusphere-db
    plan: free
    databaseName: plateforme_scolaire
    user: edusphere

services:
  - name: edusphere-backend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      # Base hébergée chez Neon (gratuite, sans expiration) : adresse
      # « directe » (sans -pooler) saisie dans le tableau de bord Render.
      # Plus liée à la base Render gratuite, qui expire au bout de 30 jours.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: EPHEMERE_LIEN_BASE_URL
        sync: false
        # Valeur définie manuellement dans le dashboard Render (non versionnée
        # ici pour ne pas être écrasée) : https://edusphere-frontend-pryg.onrender.com/acces-temporaire
      # Envoi des e-mails par l'API de Brevo (HTTPS : Render bloque le SMTP
      # sortant sur son plan gratuit). Valeurs saisies dans le tableau de
      # bord, voir backend/.env.example. Sans elles, repli sur SendGrid,
      # sinon simulation (console.log).
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM
        sync: false

  - name: edusphere-frontend
    type: web
    runtime: docker
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: BACKEND_SCHEME
        value: https
      - key: BACKEND_HOST
        # Les deux services se joignent en HTTPS public (Render ne route pas
        # de trafic privé vers un service gratuit). Render a suffixé le nom du
        # service backend (edusphere-backend-fh30 au lieu de edusphere-backend) —
        # cette valeur DOIT rester synchronisée avec l'URL réelle du service
        # edusphere-backend (visible en haut de sa page Render), sous peine
        # d'être écrasée par une resynchronisation du Blueprint.
        value: edusphere-backend-fh30.onrender.com
